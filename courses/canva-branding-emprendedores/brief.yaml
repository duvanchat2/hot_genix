mecanismo:
  nombre: "El Sistema ADN de Marca"
  explicacion: "El error más común es abrir Canva y empezar a diseñar sin estrategia. El resultado: publicaciones bonitas pero inconsistentes, que no se sienten como una marca. El Sistema ADN de Marca invierte el orden — primero defines la estrategia, después construyes el sistema visual en Canva, y solo entonces produces contenido. Así cada diseño nuevo sale coherente en minutos, no en horas."
