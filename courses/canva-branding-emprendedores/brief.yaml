    - "Estrategia: defines el ADN de tu marca, colores con psicología detrás y tipografías con personalidad"
    - "Sistema: construyes tu logo, tu paleta y tu Kit de Marca en Canva para que todo salga coherente"
    - "Producción: aplicas el sistema para crear redes, material de venta y papelería en minutos"

