  - titulo: "Módulo 2 · Limpieza y cruce de bases"
    descripcion: "Juntar información de varios archivos, quitar duplicados, cruzar datos e incluso sacar información de un PDF, como un extracto bancario."
    resultado: "Bases limpias y unificadas en minutos, no en horas"
  - titulo: "Módulo 3 · Tablas dinámicas y dashboards"
    descripcion: "Lo que viste en el video, completo y a fondo: tablas dinámicas, gráficos y un tablero que cualquier jefe entiende en diez segundos."
    resultado: "Tu primer dashboard listo para presentar"
  - titulo: "Módulo 4 · Automatiza lo repetitivo"
    descripcion: "Macros y scripts escritos por la IA. Tú no programas: la IA escribe el código y tú aprendes a pegarlo y usarlo."
    resultado: "Tareas de horas que ahora corren solas"
  - titulo: "Módulo 5 · Tu dashboard y tu primera automatización"
    descripcion: "Trabajas con tus propios datos: estados financieros, inventarios, presupuestos o cartera."
    resultado: "Sales con tu sistema funcionando en tu trabajo"

