mecanismo:
  nombre: "El Sistema de 3 Capas"
  explicacion: "La mayoría falla porque le pide todo a un solo prompt gigante. Un agente que funciona se arma en capas: primero el conocimiento del negocio, después las reglas de conversación, y encima las acciones que puede ejecutar. Separadas, cada capa se arregla sin romper las otras."
  pasos:
    - "Capa de conocimiento: todo lo que tu negocio sabe, ordenado para que la IA lo consulte sin inventar"
    - "Capa de conversación: las reglas de cómo habla, qué pregunta y cuándo pasa a un humano"
    - "Capa de acción: conectar agenda, pagos y CRM para que el agente ejecute, no solo responda"

