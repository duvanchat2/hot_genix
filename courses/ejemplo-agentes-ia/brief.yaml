    resultado: "Tu agente responde con la información real de tu negocio"
  - titulo: "Capa 2 — Cómo debe conversar"
    descripcion: "Las reglas que hacen que suene a tu marca, califique al cliente y sepa cuándo pasar a un humano."
    clases: 5
    resultado: "El agente califica solo y escala cuando toca"
  - titulo: "Capa 3 — Que ejecute, no solo hable"
    descripcion: "Conexión con WhatsApp Business, Google Calendar y tu pasarela de pago."
    clases: 6
    resultado: "El agente agenda citas y cobra sin que intervengas"
